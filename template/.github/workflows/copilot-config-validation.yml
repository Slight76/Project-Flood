name: Validate Project Flood Configuration

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/agents/**"
      - ".github/hooks/**"
      - ".github/instructions/**"
      - ".github/skills/**"
      - ".github/prompts/**"
      - ".github/copilot-instructions.md"
      - ".github/workflows/copilot-config-validation.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".agent-team/**"
      - ".project-flood/**"
  push:
    paths:
      - "AGENTS.md"
      - ".github/agents/**"
      - ".github/hooks/**"
      - ".github/instructions/**"
      - ".github/skills/**"
      - ".github/prompts/**"
      - ".github/copilot-instructions.md"
      - ".github/workflows/copilot-config-validation.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".agent-team/**"
      - ".project-flood/**"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .project-flood/requirements.txt
      - name: Install validator dependency
        run: python -m pip install --requirement .project-flood/requirements.txt
      - name: Validate configuration
        run: python .project-flood/flood.py validate --root .
      - name: Diagnose managed-file drift
        run: python .project-flood/flood.py doctor --root .
