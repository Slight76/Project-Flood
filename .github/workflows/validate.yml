name: Validate Project Flood

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate template
        run: python template/.project-flood/validate_config.py --root template
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
