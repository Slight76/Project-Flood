name: Validate Project Flood

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validator dependency
        run: python -m pip install --requirement requirements.txt
      - name: Check generated plugin and install copies
        run: python scripts/sync_distribution.py --check
      - name: Validate distribution
        run: python scripts/flood.py validate --root . --distribution
      - name: Run tests
        run: python -m unittest discover -s tests -v
